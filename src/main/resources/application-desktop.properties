# Masaüstü modu: Docker/PostgreSQL yerine gömülü H2 veritabanı.
# Veriler kullanıcının ana klasöründe tutulur: ~/CarRentalData/carrental.mv.db
spring.datasource.url=jdbc:h2:file:${user.home}/CarRentalData/carrental
spring.datasource.username=sa
spring.datasource.password=

# Sadece bu bilgisayardan erişilebilir, port otomatik seçilir (çakışma olmaz)
server.address=127.0.0.1
server.port=0

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.thymeleaf.cache=true
spring.devtools.restart.enabled=false
