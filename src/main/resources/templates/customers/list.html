<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Customers')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Customers</h1>
        <a th:href="@{/customers/new}" class="btn btn-primary">+ New customer</a>
    </div>

    <div th:replace="~{fragments :: messages}"></div>

    <form method="get" th:action="@{/customers}" class="row g-2 mb-3">
        <div class="col-md-6">
            <input type="text" name="q" th:value="${q}" class="form-control"
                   placeholder="Search by name or email">
        </div>
        <div class="col-md-6">
            <button type="submit" class="btn btn-outline-primary">Search</button>
            <a th:href="@{/customers}" class="btn btn-link">Clear</a>
        </div>
    </form>

    <table th:if="${!customers.isEmpty()}" class="table table-striped align-middle">
        <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>License no.</th>
            <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${customers}">
            <td class="fw-semibold" th:text="${c.fullName}">Anna Kovacs</td>
            <td th:text="${c.email}">anna@example.com</td>
            <td th:text="${c.phone}">+36 30 123 4567</td>
            <td th:text="${c.licenseNumber}">AB123456</td>
            <td class="text-end">
                <a th:href="@{/customers/{id}/edit(id=${c.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                <form th:action="@{/customers/{id}/delete(id=${c.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Are you sure you want to delete this customer?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${customers.isEmpty()}" class="text-muted">No customers found.</p>
</main>
</body>
</html>
