<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Customer')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <h1 class="h3 mb-3" th:text="${customer.id == null} ? 'New customer' : 'Edit customer'">Customer</h1>

    <form th:action="@{/customers/save}" th:object="${customer}" method="post" class="card card-body" style="max-width: 600px;">
        <input type="hidden" th:field="*{id}">

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="firstName" class="form-label">First name</label>
                <input type="text" th:field="*{firstName}" class="form-control"
                       th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="lastName" class="form-label">Last name</label>
                <input type="text" th:field="*{lastName}" class="form-control"
                       th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                   placeholder="name@example.com">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" th:field="*{phone}" class="form-control"
                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                   placeholder="+36 30 123 4567">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>

        <div class="mb-3">
            <label for="licenseNumber" class="form-label">Driver's license number</label>
            <input type="text" th:field="*{licenseNumber}" class="form-control text-uppercase"
                   th:classappend="${#fields.hasErrors('licenseNumber')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('licenseNumber')}" th:errors="*{licenseNumber}"></div>
        </div>

        <div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/customers}" class="btn btn-link">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
