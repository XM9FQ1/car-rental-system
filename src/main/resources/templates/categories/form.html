<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Category')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <h1 class="h3 mb-3" th:text="${category.id == null} ? 'New category' : 'Edit category'">Category</h1>

    <form th:action="@{/categories/save}" th:object="${category}" method="post" class="card card-body" style="max-width: 500px;">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                   placeholder="e.g. SUV">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/categories}" class="btn btn-link">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
