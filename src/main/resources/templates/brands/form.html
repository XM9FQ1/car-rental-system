<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Brand')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <h1 class="h3 mb-3" th:text="${brand.id == null} ? 'New brand' : 'Edit brand'">Brand</h1>

    <form th:action="@{/brands/save}" th:object="${brand}" method="post" class="card card-body" style="max-width: 500px;">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                   placeholder="e.g. Toyota">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/brands}" class="btn btn-link">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
