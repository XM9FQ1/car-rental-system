<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Brands')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Brands</h1>
        <a th:href="@{/brands/new}" class="btn btn-primary">+ New brand</a>
    </div>

    <div th:replace="~{fragments :: messages}"></div>

    <table th:if="${!brands.isEmpty()}" class="table table-striped align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${brands}">
            <td th:text="${b.id}">1</td>
            <td th:text="${b.name}">Toyota</td>
            <td class="text-end">
                <a th:href="@{/brands/{id}/edit(id=${b.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                <form th:action="@{/brands/{id}/delete(id=${b.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Are you sure you want to delete this brand?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${brands.isEmpty()}" class="text-muted">No brands yet. Click "New brand" to add one.</p>
</main>
</body>
</html>
