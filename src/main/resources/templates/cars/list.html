<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cars')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Cars</h1>
        <a th:href="@{/cars/new}" class="btn btn-primary">+ New car</a>
    </div>

    <div th:replace="~{fragments :: messages}"></div>

    <form method="get" th:action="@{/cars}" class="row g-2 align-items-end mb-3">
        <div class="col-md-3">
            <label class="form-label small text-muted" for="brandId">Brand</label>
            <select id="brandId" name="brandId" class="form-select">
                <option value="">All brands</option>
                <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"
                        th:selected="${b.id == brandId}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label small text-muted" for="categoryId">Category</label>
            <select id="categoryId" name="categoryId" class="form-select">
                <option value="">All categories</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                        th:selected="${cat.id == categoryId}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label small text-muted" for="status">Availability</label>
            <select id="status" name="status" class="form-select">
                <option value="">All statuses</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"
                        th:selected="${s == status}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-outline-primary">Filter</button>
            <a th:href="@{/cars}" class="btn btn-link">Clear</a>
        </div>
    </form>

    <table th:if="${!cars.isEmpty()}" class="table table-striped align-middle">
        <thead>
        <tr>
            <th>Plate</th>
            <th>Car</th>
            <th>Category</th>
            <th class="text-end">Daily price</th>
            <th>Status</th>
            <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${cars}">
            <td class="fw-semibold" th:text="${c.plateNumber}">ABC-123</td>
            <td th:text="${c.displayName}">Toyota Corolla 2023</td>
            <td th:text="${c.category.name}">SUV</td>
            <td class="text-end" th:text="${#numbers.formatDecimal(c.dailyPrice, 1, 'COMMA', 2, 'POINT')}">100.00</td>
            <td><span class="badge" th:classappend="${c.status.badgeClass}" th:text="${c.status.label}">Available</span></td>
            <td class="text-end">
                <a th:if="${c.status.name() == 'AVAILABLE'}" th:href="@{/rentals/new(carId=${c.id})}"
                   class="btn btn-sm btn-success">Rent</a>
                <a th:href="@{/cars/{id}/edit(id=${c.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                <form th:action="@{/cars/{id}/delete(id=${c.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Are you sure you want to delete this car?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${cars.isEmpty()}" class="text-muted">No cars found.</p>
</main>
</body>
</html>
