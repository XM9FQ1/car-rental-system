<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Car')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <h1 class="h3 mb-3" th:text="${car.id == null} ? 'New car' : 'Edit car'">Car</h1>

    <div th:if="${brands.isEmpty() or categories.isEmpty()}" class="alert alert-warning">
        You need at least one <a th:href="@{/brands}">brand</a> and one
        <a th:href="@{/categories}">category</a> before adding a car.
    </div>

    <form th:action="@{/cars/save}" th:object="${car}" method="post" class="card card-body" style="max-width: 600px;">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="brand" class="form-label">Brand</label>
            <select id="brand" name="brand" class="form-select"
                    th:classappend="${#fields.hasErrors('brand')} ? 'is-invalid'">
                <option value="">-- Select brand --</option>
                <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"
                        th:selected="${car.brand != null and car.brand.id == b.id}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <select id="category" name="category" class="form-select"
                    th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                <option value="">-- Select category --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                        th:selected="${car.category != null and car.category.id == cat.id}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
        </div>

        <div class="mb-3">
            <label for="plateNumber" class="form-label">Plate number</label>
            <input type="text" th:field="*{plateNumber}" class="form-control text-uppercase"
                   th:classappend="${#fields.hasErrors('plateNumber')} ? 'is-invalid'"
                   placeholder="e.g. ABC-123">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('plateNumber')}" th:errors="*{plateNumber}"></div>
        </div>

        <div class="mb-3">
            <label for="dailyPrice" class="form-label">Daily price</label>
            <input type="number" step="0.01" min="0.01" th:field="*{dailyPrice}" class="form-control"
                   th:classappend="${#fields.hasErrors('dailyPrice')} ? 'is-invalid'"
                   placeholder="e.g. 45.00">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('dailyPrice')}" th:errors="*{dailyPrice}"></div>
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select th:field="*{status}" class="form-select"
                    th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
        </div>

        <div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/cars}" class="btn btn-link">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
