<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Rentals')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Rentals</h1>
        <a th:href="@{/rentals/new}" class="btn btn-primary">+ New rental</a>
    </div>

    <div th:replace="~{fragments :: messages}"></div>

    <div class="btn-group mb-3" role="group">
        <a th:href="@{/rentals}" class="btn btn-outline-secondary"
           th:classappend="${show == 'all'} ? 'active'">All</a>
        <a th:href="@{/rentals(show='active')}" class="btn btn-outline-secondary"
           th:classappend="${show == 'active'} ? 'active'">Active</a>
        <a th:href="@{/rentals(show='closed')}" class="btn btn-outline-secondary"
           th:classappend="${show == 'closed'} ? 'active'">Closed</a>
    </div>

    <table th:if="${!rentals.isEmpty()}" class="table table-striped align-middle">
        <thead>
        <tr>
            <th>#</th>
            <th>Car</th>
            <th>Customer</th>
            <th>Start</th>
            <th>Planned return</th>
            <th>Returned</th>
            <th class="text-end">Price</th>
            <th>Status</th>
            <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rentals}">
            <td th:text="${r.id}">1</td>
            <td>
                <span class="fw-semibold" th:text="${r.car.plateNumber}">ABC-123</span><br>
                <small class="text-muted" th:text="${r.car.brand.name + ' · ' + r.car.category.name}">Toyota · SUV</small>
            </td>
            <td th:text="${r.customer.fullName}">Anna Kovacs</td>
            <td th:text="${r.startDate}">2026-01-01</td>
            <td th:text="${r.plannedEndDate}">2026-01-05</td>
            <td th:text="${r.returnDate != null} ? ${r.returnDate} : '-'">-</td>
            <td class="text-end">
                <span th:if="${!r.active}"
                      th:text="${#numbers.formatDecimal(r.totalPrice, 1, 'COMMA', 2, 'POINT')}">180.00</span>
                <span th:if="${r.active}" class="text-muted"
                      th:text="${#numbers.formatDecimal(r.estimatedPrice, 1, 'COMMA', 2, 'POINT')} + ' (est.)'">180.00 (est.)</span>
            </td>
            <td>
                <span th:if="${r.overdue}" class="badge text-bg-danger">Overdue</span>
                <span th:if="${r.active and !r.overdue}" class="badge text-bg-primary">Active</span>
                <span th:if="${!r.active}" class="badge text-bg-secondary">Closed</span>
            </td>
            <td class="text-end">
                <a th:if="${r.active}" th:href="@{/rentals/{id}/return(id=${r.id})}"
                   class="btn btn-sm btn-success">Return car</a>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${rentals.isEmpty()}" class="text-muted">No rentals found.</p>
</main>
</body>
</html>
