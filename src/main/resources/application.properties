spring.application.name=carrental

# Veritabanı bağlantısı
spring.datasource.url=jdbc:postgresql://localhost:5433/carrental
spring.datasource.username=carrental
spring.datasource.password=carrental

# Tabloları entity sınıflarından otomatik oluştur/güncelle
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Geliştirme sırasında Thymeleaf önbelleğini kapat
spring.thymeleaf.cache=false
